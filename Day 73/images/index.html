<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="profile card">
        <img src="image-jeremy.png" alt="">
        <h2>Jeremy Robson</h2>
        <p>Daily</p>
        <p>Weekly</p>
        <p>Monthly</p>
    </div>

    <div class="card work">
        <img src="icon-work.svg" alt="">
        <h3>Work</h3>
        <h1>32hrs</h1>
        <p>Last Week - 36hrs</p>
    </div>

    <div class="card play">
        <img src="icon-play.svg" alt="">
        <h3>Play</h3>
        <h1>10hrs</h1>
        <p>Last Week - 8hrs</p>
    </div>

    <div class="card study">
        <img src="icon-study.svg" alt="">
        <h3>Study</h3>
        <h1>4hrs</h1>
        <p>Last Week - 7hrs</p>
    </div>

    <div class="card exercise">
        <img src="icon-exercise.svg" alt="">
        <h3>Exercise</h3>
        <h1>4hrs</h1>
        <p>Last Week - 5hrs</p>
    </div>

    <div class="card social">
        <img src="icon-social.svg" alt="">
        <h3>Social</h3>
        <h1>5hrs</h1>
        <p>Last Week - 10hrs</p>
    </div>

    <div class="card selfcare">
        <img src="icon-self-care.svg" alt="">
        <h3>Self Care</h3>
        <h1>2hrs</h1>
        <p>Last Week - 2hrs</p>
    </div>

</div>

</body>
</html>
